<title>Daily Balance Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..900&family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: one calm column (max 640px). Tonal Material 3 surfaces. Story: today's wheel -> where you're heading; amber marks the one area worth fixing first. */
:root{
  --bg:#F5FBF5; --card:#FFFFFF; --surface2:#E8F0E9;
  --fg:#171D19; --fg2:#404943; --outline:#707972; --outline-v:#C0C9C1;
  --primary:#146C43; --on-primary:#FFFFFF; --primary-c:#B4F0CB; --on-primary-c:#00210F;
  --tertiary:#7D5700; --tertiary-c:#FFDEA6; --on-tertiary-c:#271900;
  --seg-mid:#7FC29C; --seg-low:#C0C9C1;
  --font-display:"Roboto Flex","Roboto",system-ui,sans-serif;
  --font-body:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1511; --card:#171D19; --surface2:#1F2621;
    --fg:#DEE4DD; --fg2:#BFC9C0; --outline:#89938B; --outline-v:#404943;
    --primary:#82D9A6; --on-primary:#00391E; --primary-c:#00522F; --on-primary-c:#B4F0CB;
    --tertiary:#F5BD52; --tertiary-c:#5E4200; --on-tertiary-c:#FFDEA6;
    --seg-mid:#3E7A58; --seg-low:#404943;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1511; --card:#171D19; --surface2:#1F2621;
  --fg:#DEE4DD; --fg2:#BFC9C0; --outline:#89938B; --outline-v:#404943;
  --primary:#82D9A6; --on-primary:#00391E; --primary-c:#00522F; --on-primary-c:#B4F0CB;
  --tertiary:#F5BD52; --tertiary-c:#5E4200; --on-tertiary-c:#FFDEA6;
  --seg-mid:#3E7A58; --seg-low:#404943;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,blockquote,figure{margin:0}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;letter-spacing:-.01em}
button,input{font:inherit;color:inherit}
.wrap{max-width:640px;margin-inline:auto;padding-inline:16px}

/* App bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--outline-v)}
.appbar .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.avatar{overflow:hidden;width:40px;height:40px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font:700 .95rem var(--font-display);flex:none}
.who{font:600 1rem/1.2 var(--font-display)}
.role{font-size:.8125rem;color:var(--fg2)}

main{display:grid;gap:16px;padding-block:20px 48px}
.screen{display:grid;gap:16px;min-width:0}
[hidden]{display:none!important}
.screen.enter{animation:rise .3s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.45}}
.seg.miss.pulse{animation:glow 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.screen.enter,.seg.miss.pulse{animation:none}.bar-fill{transition:none!important}}

/* Surfaces */
.card{background:var(--card);border:1px solid var(--outline-v);border-radius:28px;padding:24px;display:grid;gap:16px;min-width:0}
.card.tonal{background:var(--primary-c);color:var(--on-primary-c);border-color:transparent}
.card.warm{background:var(--tertiary-c);color:var(--on-tertiary-c);border-color:transparent}
.eyebrow{font:600 .75rem var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--primary)}
.tonal .eyebrow{color:var(--on-primary-c)}
.warm .eyebrow{color:var(--on-tertiary-c)}

/* Hero */
.hero{padding:28px 24px;justify-items:start}
h1{font-size:clamp(2rem,8vw,2.9rem);line-height:1.08;font-weight:750}
.hl{background:var(--tertiary-c);color:var(--on-tertiary-c);padding:0 .22em;border-radius:10px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
h2{font-size:1.5rem;line-height:1.2;font-weight:650}
.lead{font-size:1.0625rem;max-width:52ch}
.hero .lead{opacity:.9}
.coachline{display:flex;align-items:center;gap:12px;font-size:.9375rem}
.coachline .avatar{background:var(--on-primary-c);color:var(--primary-c)}
.coachline span{min-width:0}
.gets{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.gets .wheel{width:150px;flex:none}
.gets>div{flex:1 1 220px;min-width:0;display:grid;gap:12px}
.checks{list-style:none;padding:0;display:grid;gap:10px}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks svg{width:22px;height:22px;fill:var(--primary);flex:none;margin-top:1px}

/* Wheel */
.wheel{width:min(220px,64vw);aspect-ratio:1;max-width:100%;justify-self:center}
.wheel svg{display:block;width:100%;height:100%}
.seg{fill:none;stroke-width:20;stroke-linecap:round}
.seg.full{stroke:var(--primary)}
.seg.mid{stroke:var(--seg-mid)}
.seg.low{stroke:var(--seg-low)}
.seg.miss{stroke:var(--tertiary)}
.wbig{font:700 34px var(--font-display);fill:var(--fg)}
.wsmall{font:500 11px var(--font-body);fill:var(--fg2);letter-spacing:.08em;text-transform:uppercase}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 28px;border:0;border-radius:100px;font-weight:500;font-size:1.0625rem;cursor:pointer;text-decoration:none;position:relative}
.btn:focus-visible,.opt:has(input:focus-visible),.field-in:focus-visible,.copt:has(input:focus-visible) span{outline:3px solid var(--primary);outline-offset:2px}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.filled:hover:not(:disabled){background-image:linear-gradient(color-mix(in srgb,var(--on-primary) 10%,transparent),color-mix(in srgb,var(--on-primary) 10%,transparent))}
.btn.filled:disabled{background:color-mix(in srgb,var(--fg) 12%,transparent);color:color-mix(in srgb,var(--fg) 38%,transparent);cursor:not-allowed}
.btn.text{background:transparent;color:var(--primary);padding:0 16px}
.btn.text:hover{background:color-mix(in srgb,var(--primary) 10%,transparent)}
.btn.block{width:100%}
.btn svg{width:22px;height:22px;fill:currentColor;flex:none}

/* Quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.qcount{font-size:.875rem;font-weight:500;color:var(--fg2)}
.qcount b{color:var(--primary);font-weight:600}
.chip{font-size:.8125rem;font-weight:500;padding:5px 12px;border-radius:8px;background:var(--primary-c);color:var(--on-primary-c)}
.progress{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar-fill{height:100%;border-radius:3px;background:var(--primary);transition:width .3s ease}
.why{font-size:.9375rem;color:var(--fg2);padding:12px 14px;border-radius:12px;background:var(--surface2)}
#qtext{font-size:1.375rem}
.opts{display:grid;gap:10px;border:0;padding:0;margin:0;min-width:0}
.opt{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;border:1px solid var(--outline-v);background:var(--card);cursor:pointer;min-height:60px}
.opt:hover{background:color-mix(in srgb,var(--primary) 7%,var(--card))}
.opt:has(input:checked){background:var(--primary-c);color:var(--on-primary-c);border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.opt input{width:22px;height:22px;margin:0;accent-color:var(--primary);flex:none}
.opt span{min-width:0}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:4px}

/* Capture */
.field{display:grid;gap:8px}
.field>span,.chips legend{font-size:.875rem;font-weight:500;color:var(--fg2)}
.field-in{width:100%;min-height:56px;padding:0 16px;border-radius:12px;border:1px solid var(--outline);background:transparent;font-size:1.0625rem}
.field-in:hover{border-color:var(--fg)}
.chips{border:0;padding:0;margin:0;min-width:0}
.chips legend{padding:0;margin-bottom:8px}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.copt{position:relative}
.copt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.copt span{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--outline);font-weight:500;font-size:.9375rem}
.copt:hover span{background:color-mix(in srgb,var(--primary) 8%,transparent)}
.copt:has(input:checked) span{background:var(--primary-c);color:var(--on-primary-c);border-color:var(--primary)}
.copt:has(input:checked) span::before{content:"\2713";margin-right:8px}
.fine{font-size:.8125rem;color:var(--fg2)}

/* Result */
.result-head{justify-items:center;text-align:center}
.result-head h2{max-width:20ch}
.duo{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;width:100%}
.duo figure{display:grid;gap:8px;min-width:0}
.duo .wheel{width:100%;max-width:190px}
.duo figcaption{font-size:.8125rem;font-weight:500;color:var(--fg2)}
.duo .arrow{align-self:center;padding-bottom:28px}
.duo .arrow svg{width:28px;height:28px;fill:var(--primary);display:block}
.pill{font-size:.875rem;font-weight:600;padding:6px 14px;border-radius:8px;background:var(--primary-c);color:var(--on-primary-c)}
.result-head .lead{color:var(--fg2)}
.warm h2{font-size:1.75rem}
.warm p{max-width:56ch}
.tip{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--on-tertiary-c) 10%,transparent);font-size:.9375rem}
.rows{display:grid;gap:14px;list-style:none;padding:0}
.row{display:grid;gap:6px}
.row-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.row-name{font-weight:500}
.row-lvl{font-size:.8125rem;color:var(--fg2)}
.track{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.track i{display:block;height:100%;border-radius:4px}
.track i.full{background:var(--primary)}
.track i.mid{background:var(--seg-mid)}
.track i.low{background:var(--seg-low)}
.track i.miss{background:var(--tertiary)}
.cta h2{font-size:1.75rem}
.cta p{max-width:56ch}
.cta .fine{color:var(--on-primary-c)}
.sel{user-select:all;font-weight:600}

/* Footer */
.foot{margin-top:8px;padding-block:8px 40px;display:grid;gap:20px}
.igcard{display:flex;align-items:center;gap:16px;padding:18px;border-radius:24px;background:var(--card);border:1px solid var(--outline-v);text-decoration:none;color:inherit}
.igcard:hover{background:var(--surface2)}
.igring{flex:none;width:68px;height:68px;padding:3px;border-radius:50%;background:conic-gradient(from 210deg,#F9A03F,#E1306C,#8A3AB9,#4C68D7,#F9A03F)}
.igring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:3px solid var(--card)}
.igtxt{min-width:0;display:grid;gap:2px}
.igtxt b{font-family:var(--font-display);font-size:1.0625rem}
.igtxt .h{font-size:.875rem;color:var(--fg2);overflow-wrap:anywhere}
.igtxt .bio{font-size:.8125rem;color:var(--fg2);line-height:1.4;margin-top:4px}
.igfollow{flex:none;align-self:center;font-size:.875rem;font-weight:600;padding:8px 16px;border-radius:999px;background:var(--primary);color:var(--on-primary)}
.igmain{display:flex;align-items:center;gap:16px;flex:1 1 260px;min-width:0}
.igcard{flex-wrap:wrap}
@media (max-width:460px){.igfollow{width:100%;text-align:center;padding:12px 16px}}
.foot .rule{height:1px;background:var(--outline-v)}
.foot h4{margin:0 0 6px;font:600 .8125rem var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--fg2)}
.foot p{font-size:.8125rem;color:var(--fg2);line-height:1.55}
.foot .copy{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
.foot a.lnk{color:var(--primary);font-weight:600;text-decoration:none}
.legal{font-size:.8125rem;color:var(--fg2);padding:8px 4px 0}
</style>
